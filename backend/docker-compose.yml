version: "3.9"
services:
  db:
    image: postgres:15
    container_name: legalbot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legalbot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legalbot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db_data:
