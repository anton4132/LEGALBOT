openapi: 3.0.0
info:
  title: LegalBot API
  version: '1.0.0'
servers:
  - url: http://localhost:3000/api
    description: Desarrollo
  - url: https://api.legalbot.com/api
    description: Producción
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Persona:
      type: object
      required: [dni, correo, primer_nombre, apellido_paterno]
      properties:
        dni:
          type: string
        telefono:
          type: string
        correo:
          type: string
          format: email
        primer_nombre:
          type: string
        segundo_nombre:
          type: string
        apellido_paterno:
          type: string
        apellido_materno:
          type: string
        direccion:
          type: string
    AbogadoInfo:
      type: object
      properties:
        tarifabase:
          type: number
        duracionMinutos:
          type: integer
          default: 60
        direccionAtencion:
          type: string
        biografia:
          type: string
        especialidades:
          type: array
          items:
            type: string
        estudio:
          type: object
          properties:
            ruc:
              type: string
            nombre:
              type: string
            pais:
              type: string
            ciudad:
              type: string
            correo:
              type: string
              format: email
            telefono:
              type: string
            direccion:
              type: string
            activo:
              type: boolean
    UserCreateRequest:
      type: object
      required: [persona, rol_id, clave]
      properties:
        persona:
          $ref: '#/components/schemas/Persona'
        rol_id:
          type: integer
        clave:
          type: string
        abogado_info:
          $ref: '#/components/schemas/AbogadoInfo'
    UserCreated:
      type: object
      properties:
        id:
          type: integer
        rol_id:
          type: integer
        persona:
          $ref: '#/components/schemas/Persona'
    Error:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
  parameters:
    limit:
      name: limit
      in: query
      description: Número máximo de elementos a devolver
      schema:
        type: integer
        default: 10
        minimum: 1
    skip:
      name: skip
      in: query
      description: Número de elementos a omitir
      schema:
        type: integer
        default: 0
        minimum: 0
    sort:
      name: sort
      in: query
      description: Orden de resultados (campo:asc|desc)
      schema:
        type: string
paths:
  /especialidades:
    get:
      summary: Listar especialidades
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/sort'
      security: []
      responses:
        '200':
          description: Lista de especialidades
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nombre:
                      type: string
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    post:
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      security: []
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          description: Error en los datos de entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
security:
  - bearerAuth: []