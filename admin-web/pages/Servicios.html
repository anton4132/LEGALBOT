<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Servicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="app-shell">
  <div class="app">
    <nav id="sidebar" class="sidebar bg-light border-end p-3">
      <h4 class="mb-4">LegalBot</h4>
      <ul class="nav nav-pills flex-column">
        <li class="nav-item mb-2"><a class="nav-link" href="/dashboard" id="menu-home">Home</a></li>
        <li class="nav-item mb-2"><a class="nav-link" href="/pages/usuarios.html" id="menu-usuarios">Gestión de Usuarios</a></li>        <li class="nav-item mb-2"><a class="nav-link" href="/tarifas" id="menu-tarifas">Tarifas & Comisiones</a></li>
        <li class="nav-item mb-2"><a class="nav-link" href="#">Almacenamiento</a></li>
        <li class="nav-item mb-2"><a class="nav-link active" href="/servicios" id="menu-servicios">Servicios</a></li>
        <li class="nav-item mb-2"><a class="nav-link" href="#">Estadísticas</a></li>
        <li class="nav-item mt-auto"><a class="nav-link text-danger" href="#" onclick="logout()">Cerrar sesión</a></li>
      </ul>
    </nav>
    <div class="main" id="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center bg-white p-2 border-bottom flex-grow-1">
          <button class="btn btn-outline-secondary me-3 d-md-none" id="toggle-btn">☰</button>
          <div class="ms-auto">
            <div class="dropdown">
              <a class="btn btn-light dropdown-toggle fw-bold" href="#" id="profileMenu" data-bs-toggle="dropdown">Admin</a>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileMenu">
                <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Cerrar sesión</a></li>
              </ul>
            </div>
          </div>
        </div>
      </header>
      <main class="contenido p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="fw-bold">Catálogo de Servicios</h3>
          <button class="btn btn-primary" onclick="openServiceModal()">+ Nuevo Servicio</button>
        </div>
        <form class="row g-2 mb-3" id="filtersForm">
          <div class="col-md-4">
            <input type="text" class="form-control" id="searchService" placeholder="Buscar por código o nombre">
          </div>
          <div class="col-md-3">
            <select id="filterEstado" class="form-select">
              <option value="">Todos</option>
              <option value="true">Activo</option>
              <option value="false">Inactivo</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="orderBy" class="form-select">
              <option value="nombre">Ordenar: Nombre</option>
              <option value="fecha_creada">Ordenar: Fecha creación</option>
            </select>
          </div>
        </form>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="servicesTableBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="serviceModal" tabindex="-1" aria-labelledby="serviceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="serviceModalLabel">Nuevo Servicio</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="serviceForm">
            <input type="hidden" id="serviceId">
            <div class="mb-3">
              <label for="svcCodigo" class="form-label">Código *</label>
              <input type="text" class="form-control" id="svcCodigo" required>
            </div>
            <div class="mb-3">
              <label for="svcNombre" class="form-label">Nombre *</label>
              <input type="text" class="form-control" id="svcNombre" required>
            </div>
            <div class="mb-3">
              <label for="svcDescripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="svcDescripcion" rows="2"></textarea>
            </div>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="svcActivo">
              <label class="form-check-label" for="svcActivo">Activo</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="saveService()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/servicios.js"></script>
</body>
</html>
