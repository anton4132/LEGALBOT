<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    <!-- Main content -->
    <div class="flex-grow-1 invisible" id="main-content">
      <div id="adminmenu-container"></div>
        
      <main class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold">Gestión de Usuarios</h3>
            <button class="btn btn-primary">+ Nuevo Usuario</button>
        </div>
        <!-- Filtros -->
        <form class="row g-2 mb-3">
          <div class="col-md-4">
            <input type="text" class="form-control" placeholder="Buscar por nombre, DNI o celular">
          </div>
          <div class="col-md-3">
            <select class="form-select">
              <option value="">Tipo</option>
              <option>Cliente</option>
              <option>Abogado</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary w-100" type="submit">Filtrar</button>
          </div>
        </form>
        <!-- Tabla de usuarios -->
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>DNI</th>
                <th>Número</th>
                <th>Tipo</th>
                <th>Fecha registro</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Juan Pérez</td>
                <td>12345678</td>
                <td>987654321</td>
                <td>Cliente</td>
                <td>2024-05-01</td>
                <td>
                  <button class="btn btn-sm btn-info">Ver</button>
                  <button class="btn btn-sm btn-warning">Editar</button>
                  <button class="btn btn-sm btn-danger">Eliminar</button>
                </td>
              </tr>
              <tr>
                <td>María López</td>
                <td>87654321</td>
                <td>123456789</td>
                <td>Abogado</td>
                <td>2024-04-15</td>
                <td>
                  <button class="btn btn-sm btn-info">Ver</button>
                  <button class="btn btn-sm btn-warning">Editar</button>
                  <button class="btn btn-sm btn-danger">Eliminar</button>
                </td>
              </tr>
              <!-- Más filas de ejemplo -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
