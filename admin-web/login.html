<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - LegalBot Admin</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #101a2b 0%, #1a253a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-header h2 {
      color: var(--azul-noche);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .login-header p {
      color: #6c757d;
      font-size: 0.9rem;
    }
    
    .form-floating {
      margin-bottom: 1rem;
    }
    
    .form-floating input {
      border-radius: 8px;
      border: 2px solid #e9ecef;
      transition: border-color 0.3s ease;
    }
    
    .form-floating input:focus {
      border-color: var(--acento);
      box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.25);
    }
    
    .btn-login {
      background: var(--azul-noche);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      width: 100%;
      margin-top: 1rem;
      transition: all 0.3s ease;
    }
    
    .btn-login:hover {
      background: var(--azul-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(16, 26, 43, 0.3);
    }
    
    .alert {
      border-radius: 8px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>LegalBot Admin</h2>
        <p>Inicia sesión para acceder al panel de administración</p>
      </div>
      
      <div id="alert-container"></div>
      
      <form id="loginForm">
        <div class="form-floating">
          <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
          <label for="email">Correo electrónico</label>
        </div>
        
        <div class="form-floating">
          <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
          <label for="password">Contraseña</label>
        </div>
        
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">
            Recordarme
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-login">
          Iniciar Sesión
        </button>
      </form>
      
      <div class="text-center mt-3">
        <small class="text-muted">
          <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
        </small>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
