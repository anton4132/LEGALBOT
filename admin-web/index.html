<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main content -->
    <div class="flex-grow-1 invisible" id="main-content">
      <!-- Topbar -->
      <div id="adminmenu-container"></div>
      <main class="p-4">
        <div class="row mb-4">
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-primary">Clientes registrados</h6>
                <p class="card-text fs-2 text-primary" id="kpi-clientes">80</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-info">Abogados registrados</h6>
                <p class="card-text fs-2 text-info" id="kpi-abogados">43</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-success">Citas este mes</h6>
                <p class="card-text fs-2 text-success" id="kpi-citas">12</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-warning">Transacciones procesadas</h6>
                <p class="card-text fs-2 text-warning" id="kpi-transacciones">S/ 5,000</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Gráficos para clientes y abogados por separado -->
        <div class="row">
          <div class="col-12 col-md-6 mb-4">
            <div class="card h-100">
              <div class="card-header">Clientes nuevos por semana</div>
              <div class="card-body">
                <canvas id="clientesChart" height="120"></canvas>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-6 mb-4">
            <div class="card h-100">
              <div class="card-header">Abogados nuevos por semana</div>
              <div class="card-body">
                <canvas id="abogadosChart" height="120"></canvas>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="scripts.js"></script>
  <script>
    // Fechas de las últimas 6 semanas
    const semanas = [
      '2024-04-01',
      '2024-04-08',
      '2024-04-15',
      '2024-04-22',
      '2024-04-29',
      '2024-05-06'
    ];
    // Datos de ejemplo
    const clientesData = [5, 8, 6, 10, 7, 12];
    const abogadosData = [2, 3, 4, 2, 5, 6];

    // Gráfico de Clientes
    new Chart(document.getElementById('clientesChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: semanas,
        datasets: [{
          label: 'Clientes nuevos',
          data: clientesData,
          borderColor: '#0d6efd',
          backgroundColor: 'rgba(13,110,253,0.1)',
          tension: 0.3,
          fill: true,
          pointRadius: 5,
          pointBackgroundColor: '#0d6efd',
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: true },
          tooltip: { enabled: true }
        },
        scales: {
          x: {
            title: { display: true, text: 'Semana (fecha de inicio)' },
            ticks: {
              callback: function(value, index) {
                // Mostrar fecha en formato corto
                const fecha = semanas[index];
                return fecha.slice(5); // MM-DD
              }
            }
          },
          y: {
            title: { display: true, text: 'Nuevos clientes' },
            beginAtZero: true
          }
        }
      }
    });

    // Gráfico de Abogados
    new Chart(document.getElementById('abogadosChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: semanas,
        datasets: [{
          label: 'Abogados nuevos',
          data: abogadosData,
          borderColor: '#0dcaf0',
          backgroundColor: 'rgba(13,202,240,0.1)',
          tension: 0.3,
          fill: true,
          pointRadius: 5,
          pointBackgroundColor: '#0dcaf0',
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: true },
          tooltip: { enabled: true }
        },
        scales: {
          x: {
            title: { display: true, text: 'Semana (fecha de inicio)' },
            ticks: {
              callback: function(value, index) {
                const fecha = semanas[index];
                return fecha.slice(5); // MM-DD
              }
            }
          },
          y: {
            title: { display: true, text: 'Nuevos abogados' },
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>
</html>
