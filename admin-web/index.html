<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="app-shell">
  <div class="app">
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main content -->
    <div class="main invisible" id="main-content">
      <!-- Topbar -->
      <header class="topbar" id="adminmenu-container"></header>
      <main class="contenido p-4">
        <div class="row mb-4">
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-primary">Clientes registrados</h6>
                <p class="card-text fs-2 text-primary" id="kpi-clientes">80</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-info">Abogados registrados</h6>
                <p class="card-text fs-2 text-info" id="kpi-abogados">43</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-success">Citas este mes</h6>
                <p class="card-text fs-2 text-success" id="kpi-citas">12</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-3 mb-3">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title text-warning">Transacciones procesadas</h6>
                <p class="card-text fs-2 text-warning" id="kpi-transacciones">7</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Gráficos para clientes y abogados por separado -->
        <div class="row">
          <div class="col-12 col-md-6 mb-4">
            <div class="card h-100">
              <div class="card-header">Clientes nuevos por semana</div>
              <div class="card-body">
                <canvas id="clientesChart" height="120"></canvas>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-6 mb-4">
            <div class="card h-100">
              <div class="card-header">Abogados nuevos por semana</div>
              <div class="card-body">
                <canvas id="abogadosChart" height="120"></canvas>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="assets/js/scripts.js"></script>
</body>
</html>
